<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Launch countdown phase: static social preview for non-JS crawlers
         (WhatsApp, Facebook, LinkedIn). During the countdown every URL
         renders the LaunchingSoon page, so sharing any link resolves to
         this same card. REMOVE THIS BLOCK after 16 October 2026 so Seo.jsx
         (src/components/shared/Seo.jsx) becomes the single source for
         <title> / description / OG tags across routes again. -->
    <title>Launching 16 October 2026 — Obudu Conservation Centre</title>
    <meta name="description" content="The new Obudu Conservation Centre website launches 16 October 2026. Protecting the wildlife and wild lands of the Obudu Plateau since 2002." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Obudu Conservation Centre" />
    <meta property="og:title" content="Launching 16 October 2026 — Obudu Conservation Centre" />
    <meta property="og:description" content="The new Obudu Conservation Centre website launches 16 October 2026. Protecting the wildlife and wild lands of the Obudu Plateau since 2002." />
    <meta property="og:url" content="https://obuduconservationc.org/" />
    <meta property="og:image" content="https://obuduconservationc.org/assets/og/default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Launching 16 October 2026 — Obudu Conservation Centre" />
    <meta name="twitter:description" content="The new Obudu Conservation Centre website launches 16 October 2026. Protecting the wildlife and wild lands of the Obudu Plateau since 2002." />
    <meta name="twitter:image" content="https://obuduconservationc.org/assets/og/default.jpg" />

    <meta name="theme-color" content="#526829" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/logos/occ-logo.png" />
    <link rel="apple-touch-icon" href="/assets/logos/occ-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Organization structured data — helps Google show rich info for OCC -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Obudu Conservation Centre",
        "alternateName": "OCC",
        "url": "https://obuduconservationc.org",
        "logo": "https://obuduconservationc.org/assets/logos/occ-logo.png",
        "description": "Protecting the wildlife and wild lands of the Obudu Plateau and Cross River National Park, Nigeria.",
        "foundingDate": "2002",
        "founder": {
          "@type": "Person",
          "name": "Mrs Onari Duke"
        },
        "address": {
          "@type": "PostalAddress",
          "addressRegion": "Cross River State",
          "addressCountry": "NG"
        },
        "sameAs": [
          "https://www.facebook.com/obuduconservationcentre/",
          "https://www.instagram.com/obuduconservationcentre/",
          "https://www.youtube.com/@obuduconservationcentre7103",
          "https://x.com/obuducc"
        ]
      }
    </script>
